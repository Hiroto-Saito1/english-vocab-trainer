name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
      - run: uv lock --check && uv sync --group dev --frozen
      - run: uv run ruff format --check . && uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -m 'not e2e' -W error::ResourceWarning
      - run: uv run coverage report --precision=2 --fail-under=90
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e --no-cov -W error::ResourceWarning
      - run: uv build
      - run: |
          smoke_dir="$(mktemp -d)"
          uv venv "$smoke_dir/venv"
          uv pip install --python "$smoke_dir/venv/bin/python" dist/*.whl
          cd "$smoke_dir"
          env -u PYTHONPATH "$smoke_dir/venv/bin/python" -c "from pathlib import Path; from english_vocab_trainer.adapters.local.sqlite import SQLiteVocabularyRepository; path=Path('wheel.db'); repo=SQLiteVocabularyRepository(path, 'smoke'); assert {row[0] for row in repo.db.execute('SELECT version FROM schema_migrations')} == {'0001_initial.sql', '0002_auth.sql', '0003_tier.sql'}; repo.close()"
      - run: docker build --tag english-vocab-trainer:ci .
      - run: docker run --rm --entrypoint /usr/local/bin/litestream english-vocab-trainer:ci version
      - run: docker run --rm --entrypoint /app/.venv/bin/python english-vocab-trainer:ci -c "from pathlib import Path; from english_vocab_trainer.adapters.local.sqlite import SQLiteVocabularyRepository; repo=SQLiteVocabularyRepository(Path('/tmp/smoke.db'), 'smoke'); assert {row[0] for row in repo.db.execute('SELECT version FROM schema_migrations')} == {'0001_initial.sql', '0002_auth.sql', '0003_tier.sql'}; repo.close()"
      - run: "! git ls-files | grep -E '\\.(mp3|wav|m4a)$|catalog.*\\.(json|sql)'"
