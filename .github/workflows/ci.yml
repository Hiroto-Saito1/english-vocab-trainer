name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
      - run: uv lock --check && uv sync --group dev --frozen
      - run: uv run ruff format --check . && uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -m 'not e2e' -W error::ResourceWarning
      - run: uv run coverage report --precision=2 --fail-under=90
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e --no-cov -W error::ResourceWarning
      - run: uv build
      - run: "! git ls-files | grep -E '\\.(mp3|wav|m4a)$|catalog.*\\.(json|sql)'"
