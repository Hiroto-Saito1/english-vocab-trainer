name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv lock --check && uv sync --group dev --frozen
      - run: uv run ruff format --check . && uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -m 'not e2e' -W error::ResourceWarning
      - run: uv run coverage report --precision=2 --fail-under=90
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e --no-cov -W error::ResourceWarning
      - run: uv build
      - name: Verify installed wheel and ingest CLI
        run: |
          smoke_dir="$(mktemp -d)"
          uv venv "$smoke_dir/venv"
          uv pip install --python "$smoke_dir/venv/bin/python" dist/*.whl
          env -u PYTHONPATH "$smoke_dir/venv/bin/python" -c "import english_vocab_trainer; from english_vocab_trainer.ingest.cli import main; from english_vocab_trainer.worker import app"
      - name: Build the Python Worker bundle
        run: uv run pywrangler deploy --dry-run --env=""
      - name: Reject tracked private study data
        run: |
          ! git ls-files | grep -E '(^|/)[^/]*catalog[^/]*\.(json|jsonl|sql)$|\.(mp3|wav|m4a|db)$'
