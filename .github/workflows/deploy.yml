name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: Persistent Cloudflare environment to deploy
        required: true
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.target != 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      WORKER_URL: ${{ vars.WORKER_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d7c2439c6f47e0a47936428bece # v4.0.3
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
        with:
          version: "0.13.6"
      - run: uv sync --group dev --frozen
      - name: Apply Preview D1 migrations
        if: inputs.target == 'preview'
        run: uv run pywrangler d1 migrations apply DB --remote --env preview
      - name: Deploy Preview Worker
        if: inputs.target == 'preview'
        run: uv run pywrangler deploy --env preview
      - name: Apply Production D1 migrations
        if: inputs.target == 'production'
        run: uv run pywrangler d1 migrations apply DB --remote --env=""
      - name: Deploy Production Worker
        if: inputs.target == 'production'
        run: uv run pywrangler deploy --env=""
      - name: Verify authenticated readiness
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$WORKER_URL/readyz"
