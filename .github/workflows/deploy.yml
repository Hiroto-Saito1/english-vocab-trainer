name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: Persistent Cloudflare environment to deploy
        required: true
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.target != 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      WORKER_URL: ${{ vars.WORKER_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --group dev --frozen
      - name: Apply Preview D1 migrations
        if: inputs.target == 'preview'
        run: uv run pywrangler d1 migrations apply DB --remote --env preview
      - name: Deploy Preview Worker
        if: inputs.target == 'preview'
        run: uv run pywrangler deploy --env preview
      - name: Apply Production D1 migrations
        if: inputs.target == 'production'
        run: uv run pywrangler d1 migrations apply DB --remote --env=""
      - name: Deploy Production Worker
        if: inputs.target == 'production'
        run: uv run pywrangler deploy --env=""
      - name: Verify authenticated readiness
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$WORKER_URL/readyz"
