[project]
name = "english-vocab-trainer"
version = "0.1.0"
description = "Private, audio-first English vocabulary trainer"
requires-python = ">=3.13"
dependencies = ["boto3>=1.36", "fastapi>=0.115", "jinja2>=3.1", "pydantic>=2.10", "uvicorn>=0.34", "fsrs>=5.1"]

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3", "pytest-asyncio>=0.25", "pytest-cov>=6.0", "pytest-playwright>=0.7", "hypothesis>=6.124", "ruff>=0.9", "httpx>=0.28"]
ingest = ["mlx-whisper>=0.4", "tqdm>=4.66,<4.70"]

[project.scripts]
vocab-ingest = "english_vocab_trainer.ingest:main"

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/english_vocab_trainer/adapters/local/sqlite.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["english_vocab_trainer"]

[[tool.mypy.overrides]]
module = ["mlx_whisper"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=english_vocab_trainer --cov-branch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = ["e2e: browser tests that require installed Chromium"]

[tool.coverage.report]
precision = 2
fail_under = 90

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/english_vocab_trainer"]
artifacts = ["src/english_vocab_trainer/web/templates/**", "src/english_vocab_trainer/web/static/**", "migrations/**"]
