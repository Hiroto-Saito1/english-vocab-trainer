[project]
name = "english-vocab-trainer"
version = "0.1.0"
description = "Private, online English vocabulary trainer with server-backed history"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "fsrs>=5.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-playwright>=0.7",
    "ruff>=0.9",
    "uvicorn>=0.34",
    "workers-py",
    "workers-runtime-sdk",
]
ingest = ["boto3>=1.36", "mlx-whisper>=0.4", "tqdm>=4.66,<4.70"]

[project.scripts]
vocab-ingest = "english_vocab_trainer.ingest.cli:main"

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["english_vocab_trainer"]

[[tool.mypy.overrides]]
module = ["js", "mlx_whisper", "pyodide.ffi"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=english_vocab_trainer --cov-branch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = ["e2e: browser tests that require installed Chromium"]

[tool.coverage.report]
precision = 2
fail_under = 90

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/english_vocab_trainer"]
artifacts = ["src/english_vocab_trainer/migrations/*.sql"]
