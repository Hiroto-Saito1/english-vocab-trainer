<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title><style>body{margin:0;background:#f7fafc;color:#102a43;font:18px system-ui}main{max-width:28rem;margin:auto;padding:2rem}input,button{font:inherit;padding:.8rem;width:100%;box-sizing:border-box;margin:.5rem 0}button{border:0;border-radius:.5rem;background:#102a43;color:#fff}.error{color:#9b2c2c}</style></head><body><main><h1>English Vocab Trainer</h1><h2>Sign in</h2>{% if error %}<p class="error">Sign in failed. Please try again.</p>{% endif %}<form method="post" action="/login"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required autofocus><button type="submit">Sign in</button></form></main></body></html>
